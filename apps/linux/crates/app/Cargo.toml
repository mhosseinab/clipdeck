[package]
name = "clipdeck-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "clipdeck"
path = "src/main.rs"

[dependencies]
clipdeck-core = { path = "../core" }
serde_json = "1"
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
winit = "0.30"
softbuffer = "0.4"
tiny-skia = "0.11"
fontdue = "0.9"
global-hotkey = "0.6"
png = "0.17"
sha2 = "0.10"
x11-dl = "2"
