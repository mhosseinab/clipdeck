name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Verification only. No tag trigger, publishing job or write token.
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/linux
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config desktop-file-utils appstream
      - name: Install packaging helper
        run: cargo install cargo-deb --version 3.8.0 --locked
      - name: Verify and package local candidate
        run: bash scripts/package.sh
